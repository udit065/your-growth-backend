# Render's free tier sleeps after ~15 minutes idle, which makes the first
# request take 30-60 seconds. This pings /health so the API stays awake.
# Note: GitHub may pause scheduled workflows after 60 days with no repo activity.
name: Keep API warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: curl -fsS --max-time 90 https://your-growth-backend.onrender.com/health || true
